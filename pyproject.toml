[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdlens-open"
version = "0.1.0"
description = "Human-reviewed video evidence analysis with anonymous person tracks and optional weapon detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "CrowdLens contributors"}]
keywords = ["computer-vision", "video-analysis", "object-detection", "tracking", "human-in-the-loop"]
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.9,<5", "ultralytics>=8.3,<9"]
reid = ["torchvision>=0.18,<1"]
ui = ["streamlit>=1.35,<2"]
test = ["pytest>=8,<10"]
all = ["opencv-python-headless>=4.9,<5", "ultralytics>=8.3,<9", "torchvision>=0.18,<1", "streamlit>=1.35,<2", "pytest>=8,<10"]

[project.scripts]
crowdlens = "crowdlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

